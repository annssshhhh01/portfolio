<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="launchpadBg" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#E2E3E5" />
      <stop offset="100%" stop-color="#C5C6C8" />
    </linearGradient>
  </defs>
  <!-- Base rounded rectangle shape -->
  <rect width="100" height="100" rx="22" fill="url(#launchpadBg)" />
  
  <!-- The 3x3 colorful grid (Big Sur style Launchpad) -->
  <g transform="translate(19, 19)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="16" height="16" rx="5" fill="#FF3B30" />
    <rect x="23" y="0" width="16" height="16" rx="5" fill="#FF9500" />
    <rect x="46" y="0" width="16" height="16" rx="5" fill="#FFCC00" />
    
    <!-- Row 2 -->
    <rect x="0" y="23" width="16" height="16" rx="5" fill="#4CD964" />
    <rect x="23" y="23" width="16" height="16" rx="5" fill="#5856D6" />
    <rect x="46" y="23" width="16" height="16" rx="5" fill="#007AFF" />
    
    <!-- Row 3 -->
    <rect x="0" y="46" width="16" height="16" rx="5" fill="#FF2D55" />
    <rect x="23" y="46" width="16" height="16" rx="5" fill="#AF52DE" />
    <rect x="46" y="46" width="16" height="16" rx="5" fill="#8E8E93" />
  </g>
</svg>
