<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#32C5FF" />
      <stop offset="100%" stop-color="#005EEA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Base rounded rectangle shape -->
  <rect width="100" height="100" rx="22" fill="url(#aboutBg)" />
  
  <!-- Premium white user silhouette -->
  <g filter="url(#shadow)">
    <circle cx="50" cy="40" r="18" fill="#FFFFFF" />
    <path d="M 20 90 C 20 65 80 65 80 90 Z" fill="#FFFFFF" />
  </g>
</svg>
